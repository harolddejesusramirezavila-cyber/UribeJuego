name: Compilar APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias del sistema y Buildozer
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk python3-pip build-essential ccache git libffi-dev libssl-dev libtinfo5 zip unzip tar autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libgdbm-dev libdb5.3-dev libbz2-dev libexpat1-dev liblzma-dev sqlite3 libsqlite3-dev libffi7 libjpeg-dev zlib1g-dev
          pip install --upgrade pip setuptools
          pip install buildozer "cython<3.0.0"

      - name: Generar APK
        run: |
          yes | buildozer init
          sed -i 's/title = My Application/title = Uribe Bros/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = uribebros/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,pygame-ce/' buildozer.spec
          buildozer -v android debug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: UribeBros-APK
          path: bin/*.apk
          
          
