name: Compilar APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk python3-pip build-essential git zip unzip tar libssl-dev libffi-dev
          pip install --upgrade pip setuptools
          pip install buildozer "cython<3.0.0"

      - name: Generar APK
        run: |
          buildozer init
          sed -i 's/title = My Application/title = Uribe Bros/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = uribebros/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,pygame-ce/' buildozer.spec
          buildozer -v android debug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: UribeBros-APK
          path: bin/*.apk
          
          
          
