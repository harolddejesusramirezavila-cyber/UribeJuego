name: Compilar APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar buildozer.spec
        run: |
          pip install buildozer
          buildozer init
          sed -i 's/title = My Application/title = Uribe Bros/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = uribebros/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,pygame_ce/' buildozer.spec
          sed -i 's/source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,jpeg/' buildozer.spec

      - name: Compilar APK con Buildozer Action
        uses: ArtemShedko/buildozer-action@v1
        with:
          command: buildozer -v android debug
          subfolder: '.'

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: UribeBros-APK
          path: bin/*.apk
          
