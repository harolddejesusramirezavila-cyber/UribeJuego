name: Compilar APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk python3-pip
          pip install buildozer cython==0.29.33

      - name: Generar APK
        run: |
          yes | buildozer init
          sed -i 's/title = My Application/title = Uribe Bros/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = uribebros/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,pygame-ce/' buildozer.spec
          buildozer -v android debug

      - name: Subir APK
        uses: actions/upload-artifact@v3
        with:
          name: UribeBros-APK
          path: bin/*.apk
